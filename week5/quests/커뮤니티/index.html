<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 커뮤니티</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ 모든 CDN은 버전을 명시적으로 고정한다. Babel 은 반드시 7.x -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .animate-fade-in { animation: fade-in .2s ease-out; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>
  <script type="text/babel">
    // ========================================
    // React Hooks Destructuring
    // ========================================
    const { useState, useEffect, useCallback, useMemo, useContext, createContext } = React;

    // ========================================
    // 📡 API Client (JWT 인증)
    // ========================================
    // 로그인/가입 시 서버가 발급한 JWT 를 localStorage 에 보관하고,
    // 이후 모든 요청에 Authorization: Bearer <token> 헤더로 붙인다.
    const API_BASE_URL = '/api';
    const TOKEN_KEY = 'community.token';

    const tokenStore = {
      get() { try { return localStorage.getItem(TOKEN_KEY); } catch { return null; } },
      set(token) { try { localStorage.setItem(TOKEN_KEY, token); } catch {} },
      clear() { try { localStorage.removeItem(TOKEN_KEY); } catch {} },
    };

    class ApiError extends Error {
      constructor(status, message) {
        super(message);
        this.status = status;
      }
    }

    // 토큰이 만료·무효(401)면 AuthProvider 가 로그아웃 처리하도록 알린다
    let onUnauthorized = () => {};

    async function request(method, endpoint, body) {
      const headers = { 'Content-Type': 'application/json' };
      const token = tokenStore.get();
      if (token) headers.Authorization = `Bearer ${token}`;

      let res;
      try {
        res = await fetch(`${API_BASE_URL}${endpoint}`, { method, headers, body: body ? JSON.stringify(body) : undefined });
      } catch {
        throw new ApiError(0, '서버에 연결할 수 없어요. 서버가 실행 중인지 확인해 주세요.');
      }
      const json = await res.json().catch(() => null);
      if (!res.ok || !json || !json.success) {
        if (res.status === 401 && token) onUnauthorized();
        throw new ApiError(res.status, (json && json.message) || '요청을 처리하지 못했어요.');
      }
      return json.data;
    }

    const api = {
      signup: form => request('POST', '/auth/signup', form),
      login: creds => request('POST', '/auth/login', creds),
      me: () => request('GET', '/auth/me'),
      listPosts: () => request('GET', '/posts'),
      getPost: id => request('GET', `/posts/${encodeURIComponent(id)}`),
      createPost: data => request('POST', '/posts', data),
      updatePost: (id, data) => request('PUT', `/posts/${encodeURIComponent(id)}`, data),
      deletePost: id => request('DELETE', `/posts/${encodeURIComponent(id)}`),
    };

    // ========================================
    // 🛠️ Utils
    // ========================================
    function formatDateTime(ts) {
      const d = new Date(ts);
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function timeAgo(ts) {
      const diff = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
      if (diff < 60) return '방금 전';
      if (diff < 3600) return `${Math.floor(diff / 60)}분 전`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
      if (diff < 86400 * 7) return `${Math.floor(diff / 86400)}일 전`;
      return formatDateTime(ts);
    }

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Button({ variant = 'primary', size = 'md', disabled, className = '', type = 'button', children, ...rest }) {
      const variants = {
        primary: 'bg-indigo-600 text-white hover:bg-indigo-700 focus-visible:ring-indigo-500',
        secondary: 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 focus-visible:ring-slate-400',
        danger: 'bg-rose-600 text-white hover:bg-rose-700 focus-visible:ring-rose-500',
        ghost: 'text-slate-600 hover:bg-slate-100 focus-visible:ring-slate-400',
      };
      const sizes = { sm: 'px-3 py-1.5 text-sm', md: 'px-4 py-2 text-sm', lg: 'px-5 py-3 text-base' };
      return (
        <button
          type={type}
          disabled={disabled}
          className={`inline-flex items-center justify-center gap-2 rounded-lg font-medium transition focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed ${variants[variant]} ${sizes[size]} ${className}`}
          {...rest}
        >
          {children}
        </button>
      );
    }

    function Input({ id, label, type = 'text', value, onChange, placeholder, error, disabled, className = '', ...rest }) {
      return (
        <div className={className}>
          {label && <label htmlFor={id} className="block text-sm font-medium text-slate-700 mb-1">{label}</label>}
          <input
            id={id}
            type={type}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            disabled={disabled}
            aria-invalid={!!error}
            aria-describedby={error ? `${id}-error` : undefined}
            className={`w-full rounded-lg border px-3 py-2 text-sm outline-none transition focus:ring-2 disabled:bg-slate-100 ${error ? 'border-rose-400 focus:ring-rose-200' : 'border-slate-300 focus:border-indigo-500 focus:ring-indigo-100'}`}
            {...rest}
          />
          {error && <p id={`${id}-error`} className="mt-1 text-xs text-rose-600">{error}</p>}
        </div>
      );
    }

    function Textarea({ id, label, value, onChange, placeholder, error, disabled, rows = 10, className = '', ...rest }) {
      return (
        <div className={className}>
          {label && <label htmlFor={id} className="block text-sm font-medium text-slate-700 mb-1">{label}</label>}
          <textarea
            id={id}
            rows={rows}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            disabled={disabled}
            aria-invalid={!!error}
            aria-describedby={error ? `${id}-error` : undefined}
            className={`w-full rounded-lg border px-3 py-2 text-sm leading-relaxed outline-none transition resize-y focus:ring-2 disabled:bg-slate-100 ${error ? 'border-rose-400 focus:ring-rose-200' : 'border-slate-300 focus:border-indigo-500 focus:ring-indigo-100'}`}
            {...rest}
          />
          {error && <p id={`${id}-error`} className="mt-1 text-xs text-rose-600">{error}</p>}
        </div>
      );
    }

    function Card({ className = '', children, ...rest }) {
      return (
        <div className={`bg-white rounded-2xl shadow-sm border border-slate-200 p-6 ${className}`} {...rest}>
          {children}
        </div>
      );
    }

    function Modal({ isOpen, onClose, title, children, size = 'sm' }) {
      useEffect(() => {
        if (!isOpen) return;
        const onKey = e => e.key === 'Escape' && onClose();
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [isOpen, onClose]);

      if (!isOpen) return null;
      const sizes = { sm: 'max-w-sm', md: 'max-w-md', lg: 'max-w-lg' };
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40" onClick={onClose}>
          <div
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-title"
            className={`w-full ${sizes[size]} bg-white rounded-2xl shadow-xl p-6 animate-fade-in`}
            onClick={e => e.stopPropagation()}
          >
            <h2 id="modal-title" className="text-lg font-semibold mb-3">{title}</h2>
            {children}
          </div>
        </div>
      );
    }

    function Alert({ children, className = '' }) {
      if (!children) return null;
      return (
        <div role="alert" className={`rounded-lg bg-rose-50 border border-rose-200 px-3 py-2 text-sm text-rose-700 ${className}`}>
          {children}
        </div>
      );
    }

    function Spinner({ label = '불러오는 중...' }) {
      return (
        <div className="flex items-center justify-center gap-3 py-16 text-slate-500" role="status">
          <span className="h-5 w-5 rounded-full border-2 border-slate-300 border-t-indigo-600 animate-spin" />
          <span className="text-sm">{label}</span>
        </div>
      );
    }

    function Avatar({ name = '?', className = '' }) {
      return (
        <span className={`inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-indigo-100 text-xs font-semibold text-indigo-700 ${className}`} aria-hidden="true">
          {name.slice(0, 1)}
        </span>
      );
    }

    // ========================================
    // 🔀 Router Components
    // ========================================
    const RouterContext = createContext(null);

    const getPath = () => window.location.hash.replace(/^#/, '') || '/';

    function Router({ children }) {
      const [path, setPath] = useState(getPath());
      useEffect(() => {
        const onHash = () => setPath(getPath());
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);
      const navigate = useCallback(to => { window.location.hash = to; }, []);
      return <RouterContext.Provider value={{ path, navigate, params: {} }}>{children}</RouterContext.Provider>;
    }

    function matchRoute(pattern, path) {
      const pp = pattern.split('/').filter(Boolean);
      const ap = path.split('/').filter(Boolean);
      if (pp.length !== ap.length) return null;
      const params = {};
      for (let i = 0; i < pp.length; i++) {
        if (pp[i].startsWith(':')) params[pp[i].slice(1)] = decodeURIComponent(ap[i]);
        else if (pp[i] !== ap[i]) return null;
      }
      return params;
    }

    function Route() { return null; }

    function Routes({ children, fallback = null }) {
      const router = useContext(RouterContext);
      for (const child of React.Children.toArray(children)) {
        const params = matchRoute(child.props.path, router.path);
        if (params) {
          return <RouterContext.Provider value={{ ...router, params }}>{child.props.element}</RouterContext.Provider>;
        }
      }
      return fallback;
    }

    function Link({ to, className = '', children, ...rest }) {
      return <a href={`#${to}`} className={className} {...rest}>{children}</a>;
    }

    const useRouter = () => useContext(RouterContext);
    const useParams = () => useContext(RouterContext).params;

    // ========================================
    // 🔐 Auth Context
    // ========================================
    const AuthContext = createContext(null);

    // user: undefined = 토큰 확인 중, null = 비로그인, object = 로그인
    function AuthProvider({ children }) {
      const [user, setUser] = useState(() => (tokenStore.get() ? undefined : null));

      const logout = useCallback(() => { tokenStore.clear(); setUser(null); }, []);

      // 새로고침 시 저장된 토큰으로 내 정보를 복원한다
      useEffect(() => {
        onUnauthorized = logout;
        if (!tokenStore.get()) return;
        api.me().then(setUser).catch(() => logout());
      }, [logout]);

      const applyAuth = useCallback(({ token, user }) => { tokenStore.set(token); setUser(user); }, []);
      const login = useCallback(async creds => applyAuth(await api.login(creds)), [applyAuth]);
      const signup = useCallback(async form => applyAuth(await api.signup(form)), [applyAuth]);

      const value = useMemo(() => ({ user, login, signup, logout }), [user, login, signup, logout]);
      return <AuthContext.Provider value={value}>{children}</AuthContext.Provider>;
    }

    const useAuth = () => useContext(AuthContext);

    // 로그인하지 않은 사용자는 로그인 화면으로 보낸다
    function RequireAuth({ children }) {
      const { user } = useAuth();
      const { navigate } = useRouter();
      useEffect(() => { if (user === null) navigate('/login'); }, [user, navigate]);
      if (user === undefined) return <Spinner label="로그인 정보 확인 중..." />;
      return user ? children : null;
    }

    // 이미 로그인한 사용자는 로그인/가입 화면 대신 목록으로 보낸다
    function GuestOnly({ children }) {
      const { user } = useAuth();
      const { navigate } = useRouter();
      useEffect(() => { if (user) navigate('/'); }, [user, navigate]);
      if (user === undefined) return <Spinner label="로그인 정보 확인 중..." />;
      return user ? null : children;
    }

    // ========================================
    // 🧩 Common/Layout Components
    // ========================================
    function Header() {
      const { user, logout } = useAuth();
      const { navigate } = useRouter();
      const handleLogout = () => { logout(); navigate('/login'); };

      return (
        <header className="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-slate-200">
          <div className="max-w-3xl mx-auto flex items-center justify-between px-4 h-14">
            <Link to="/" className="flex items-center gap-2 font-bold text-lg text-slate-900">
              <span aria-hidden="true">💬</span> 우리 커뮤니티
            </Link>
            {user && (
              <nav className="flex items-center gap-2 sm:gap-3" aria-label="사용자 메뉴">
                <span className="hidden sm:flex items-center gap-2 text-sm text-slate-600">
                  <Avatar name={user.name} /> <b className="text-slate-800">{user.name}</b>님
                </span>
                <Button size="sm" variant="ghost" onClick={handleLogout}>로그아웃</Button>
              </nav>
            )}
          </div>
        </header>
      );
    }

    function AuthLayout({ title, subtitle, children, footer }) {
      return (
        <div className="min-h-[calc(100vh-3.5rem)] flex items-center justify-center px-4 py-10">
          <Card className="w-full max-w-sm animate-fade-in">
            <div className="text-center mb-6">
              <div className="text-4xl mb-2" aria-hidden="true">💬</div>
              <h1 className="text-xl font-bold">{title}</h1>
              <p className="text-sm text-slate-500 mt-1">{subtitle}</p>
            </div>
            {children}
            <div className="mt-6 text-center text-sm text-slate-500">{footer}</div>
          </Card>
        </div>
      );
    }

    function PageContainer({ children }) {
      return <main className="max-w-3xl mx-auto px-4 py-6 sm:py-10 animate-fade-in">{children}</main>;
    }

    // ========================================
    // 📄 Page Components
    // ========================================
    function LoginPage() {
      const { login } = useAuth();
      const { navigate } = useRouter();
      const [form, setForm] = useState({ username: '', password: '' });
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async e => {
        e.preventDefault();
        if (!form.username.trim() || !form.password) {
          setError('아이디와 비밀번호를 입력해 주세요.');
          return;
        }
        setLoading(true);
        setError('');
        try {
          await login({ username: form.username.trim(), password: form.password });
          navigate('/');
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <AuthLayout
          title="로그인"
          subtitle="커뮤니티에 오신 것을 환영합니다"
          footer={<>아직 회원이 아니신가요? <Link to="/signup" className="font-medium text-indigo-600 hover:underline">회원가입</Link></>}
        >
          <form onSubmit={handleSubmit} className="space-y-4" noValidate>
            <Input id="login-username" label="아이디" value={form.username} autoComplete="username"
              onChange={e => setForm({ ...form, username: e.target.value })} placeholder="아이디" />
            <Input id="login-password" label="비밀번호" type="password" value={form.password} autoComplete="current-password"
              onChange={e => setForm({ ...form, password: e.target.value })} placeholder="비밀번호" />
            <Alert>{error}</Alert>
            <Button type="submit" className="w-full" size="lg" disabled={loading}>
              {loading ? '로그인 중...' : '로그인'}
            </Button>
          </form>
        </AuthLayout>
      );
    }

    function SignupPage() {
      const { signup } = useAuth();
      const { navigate } = useRouter();
      const [form, setForm] = useState({ username: '', name: '', password: '', confirm: '' });
      const [errors, setErrors] = useState({});
      const [serverError, setServerError] = useState('');
      const [loading, setLoading] = useState(false);

      const validate = () => {
        const next = {};
        if (!/^[a-zA-Z0-9_]{4,20}$/.test(form.username)) next.username = '영문·숫자·밑줄 4~20자로 입력해 주세요.';
        if (!form.name.trim()) next.name = '이름(닉네임)을 입력해 주세요.';
        else if (form.name.trim().length > 20) next.name = '이름은 20자 이하로 입력해 주세요.';
        if (form.password.length < 8 || form.password.length > 72) next.password = '비밀번호는 8~72자로 입력해 주세요.';
        if (form.confirm !== form.password) next.confirm = '비밀번호가 일치하지 않습니다.';
        setErrors(next);
        return Object.keys(next).length === 0;
      };

      const handleSubmit = async e => {
        e.preventDefault();
        if (!validate()) return;
        setLoading(true);
        setServerError('');
        try {
          await signup({ username: form.username, name: form.name.trim(), password: form.password });
          navigate('/');
        } catch (err) {
          setServerError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const field = key => ({ value: form[key], error: errors[key], onChange: e => setForm({ ...form, [key]: e.target.value }) });

      return (
        <AuthLayout
          title="회원가입"
          subtitle="가입하고 이야기를 나눠 보세요"
          footer={<>이미 계정이 있으신가요? <Link to="/login" className="font-medium text-indigo-600 hover:underline">로그인</Link></>}
        >
          <form onSubmit={handleSubmit} className="space-y-4" noValidate>
            <Input id="signup-username" label="아이디" placeholder="영문·숫자 4~20자" autoComplete="username" {...field('username')} />
            <Input id="signup-name" label="이름 (게시글에 표시돼요)" placeholder="예: 홍길동" autoComplete="nickname" {...field('name')} />
            <Input id="signup-password" label="비밀번호" type="password" placeholder="8자 이상" autoComplete="new-password" {...field('password')} />
            <Input id="signup-confirm" label="비밀번호 확인" type="password" placeholder="비밀번호 재입력" autoComplete="new-password" {...field('confirm')} />
            <Alert>{serverError}</Alert>
            <Button type="submit" className="w-full" size="lg" disabled={loading}>
              {loading ? '가입 중...' : '가입하기'}
            </Button>
          </form>
        </AuthLayout>
      );
    }

    function PostListPage() {
      const { user } = useAuth();
      const [posts, setPosts] = useState(null);
      const [error, setError] = useState('');

      useEffect(() => {
        let alive = true;
        api.listPosts()
          .then(data => alive && setPosts(data))
          .catch(err => alive && setError(err.message));
        return () => { alive = false; };
      }, []);

      return (
        <PageContainer>
          <div className="flex items-end justify-between mb-5">
            <div>
              <h1 className="text-2xl font-bold">전체 게시글</h1>
              <p className="text-sm text-slate-500 mt-1">
                {posts ? `총 ${posts.length}개 · 최신순` : '최신순으로 보여드려요'}
              </p>
            </div>
            <Link to="/posts/new">
              <Button tabIndex={-1}>✏️ 글쓰기</Button>
            </Link>
          </div>

          <Alert className="mb-4">{error}</Alert>

          {!posts && !error && <Spinner />}

          {posts && posts.length === 0 && (
            <Card className="text-center py-16">
              <div className="text-4xl mb-3" aria-hidden="true">📝</div>
              <p className="font-medium">아직 게시글이 없어요</p>
              <p className="text-sm text-slate-500 mt-1 mb-5">첫 번째 글을 작성해 보세요!</p>
              <Link to="/posts/new"><Button tabIndex={-1}>첫 글 쓰기</Button></Link>
            </Card>
          )}

          {posts && posts.length > 0 && (
            <ul className="bg-white rounded-2xl border border-slate-200 shadow-sm divide-y divide-slate-100 overflow-hidden">
              {posts.map(post => (
                <li key={post.id}>
                  <Link to={`/posts/${post.id}`} className="block px-5 py-4 hover:bg-slate-50 focus:bg-slate-50 focus:outline-none transition">
                    <div className="flex items-center gap-2">
                      <h2 className="font-semibold text-slate-900 truncate">{post.title}</h2>
                      {post.authorId === user.id && (
                        <span className="shrink-0 rounded-full bg-indigo-50 px-2 py-0.5 text-[11px] font-medium text-indigo-600">내 글</span>
                      )}
                    </div>
                    <div className="mt-1.5 flex items-center gap-2 text-xs text-slate-500">
                      <span className="font-medium text-slate-600">{post.authorName}</span>
                      <span aria-hidden="true">·</span>
                      <time dateTime={new Date(post.createdAt).toISOString()} title={formatDateTime(post.createdAt)}>
                        {timeAgo(post.createdAt)}
                      </time>
                    </div>
                  </Link>
                </li>
              ))}
            </ul>
          )}
        </PageContainer>
      );
    }

    function PostDetailPage() {
      const { id } = useParams();
      const { user } = useAuth();
      const { navigate } = useRouter();
      const [post, setPost] = useState(null);
      const [error, setError] = useState('');
      const [confirmOpen, setConfirmOpen] = useState(false);
      const [deleting, setDeleting] = useState(false);

      useEffect(() => {
        let alive = true;
        api.getPost(id)
          .then(data => alive && setPost(data))
          .catch(err => alive && setError(err.message));
        return () => { alive = false; };
      }, [id]);

      const handleDelete = async () => {
        setDeleting(true);
        try {
          await api.deletePost(id);
          navigate('/');
        } catch (err) {
          setError(err.message);
          setConfirmOpen(false);
        } finally {
          setDeleting(false);
        }
      };

      const isMine = post && post.authorId === user.id;

      return (
        <PageContainer>
          <Link to="/" className="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-slate-800 mb-4">← 목록으로</Link>

          <Alert className="mb-4">{error}</Alert>
          {!post && !error && <Spinner />}

          {post && (
            <Card className="p-0 sm:p-0">
              <article>
                <header className="px-6 pt-6 pb-4 border-b border-slate-100">
                  <h1 className="text-2xl font-bold break-words">{post.title}</h1>
                  <div className="mt-3 flex flex-wrap items-center gap-2 text-sm text-slate-500">
                    <Avatar name={post.authorName} />
                    <span className="font-medium text-slate-700">{post.authorName}</span>
                    <span aria-hidden="true">·</span>
                    <time dateTime={new Date(post.createdAt).toISOString()}>{formatDateTime(post.createdAt)}</time>
                    {post.updatedAt && <span className="text-xs text-slate-400">(수정됨 {formatDateTime(post.updatedAt)})</span>}
                  </div>
                </header>
                <div className="px-6 py-6 whitespace-pre-wrap break-words leading-relaxed text-slate-700 min-h-[8rem]">
                  {post.content}
                </div>
                {isMine && (
                  <footer className="px-6 py-4 border-t border-slate-100 flex justify-end gap-2">
                    <Button variant="secondary" size="sm" onClick={() => navigate(`/posts/${post.id}/edit`)}>수정</Button>
                    <Button variant="danger" size="sm" onClick={() => setConfirmOpen(true)}>삭제</Button>
                  </footer>
                )}
              </article>
            </Card>
          )}

          <Modal isOpen={confirmOpen} onClose={() => setConfirmOpen(false)} title="게시글 삭제">
            <p className="text-sm text-slate-600 mb-6">이 게시글을 삭제할까요? 삭제한 글은 되돌릴 수 없어요.</p>
            <div className="flex justify-end gap-2">
              <Button variant="secondary" onClick={() => setConfirmOpen(false)} disabled={deleting}>취소</Button>
              <Button variant="danger" onClick={handleDelete} disabled={deleting}>{deleting ? '삭제 중...' : '삭제'}</Button>
            </div>
          </Modal>
        </PageContainer>
      );
    }

    // 작성/수정 공용 폼 페이지. id 파라미터가 있으면 수정 모드.
    function PostFormPage() {
      const { id } = useParams();
      const isEdit = !!id;
      const { user } = useAuth();
      const { navigate } = useRouter();
      const [form, setForm] = useState({ title: '', content: '' });
      const [errors, setErrors] = useState({});
      const [serverError, setServerError] = useState('');
      const [loading, setLoading] = useState(isEdit);
      const [saving, setSaving] = useState(false);

      useEffect(() => {
        if (!isEdit) return;
        let alive = true;
        api.getPost(id)
          .then(post => {
            if (!alive) return;
            if (post.authorId !== user.id) {
              setServerError('본인이 작성한 글만 수정할 수 있습니다.');
              return;
            }
            setForm({ title: post.title, content: post.content });
          })
          .catch(err => alive && setServerError(err.message))
          .finally(() => alive && setLoading(false));
        return () => { alive = false; };
      }, [id, isEdit, user.id]);

      const handleSubmit = async e => {
        e.preventDefault();
        const next = {};
        if (!form.title.trim()) next.title = '제목을 입력해 주세요.';
        else if (form.title.trim().length > 100) next.title = '제목은 100자 이하로 입력해 주세요.';
        if (!form.content.trim()) next.content = '내용을 입력해 주세요.';
        setErrors(next);
        if (Object.keys(next).length) return;

        setSaving(true);
        setServerError('');
        try {
          const payload = { title: form.title.trim(), content: form.content.trim() };
          const post = isEdit ? await api.updatePost(id, payload) : await api.createPost(payload);
          navigate(`/posts/${post.id}`);
        } catch (err) {
          setServerError(err.message);
        } finally {
          setSaving(false);
        }
      };

      const blocked = isEdit && serverError && !form.title;

      return (
        <PageContainer>
          <Link to={isEdit ? `/posts/${id}` : '/'} className="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-slate-800 mb-4">← 돌아가기</Link>
          <h1 className="text-2xl font-bold mb-5">{isEdit ? '게시글 수정' : '새 글 쓰기'}</h1>

          {loading ? <Spinner /> : blocked ? <Alert>{serverError}</Alert> : (
            <Card>
              <form onSubmit={handleSubmit} className="space-y-4" noValidate>
                <Input id="post-title" label="제목" placeholder="제목을 입력하세요" value={form.title} error={errors.title}
                  maxLength={100} onChange={e => setForm({ ...form, title: e.target.value })} />
                <Textarea id="post-content" label="내용" placeholder="내용을 입력하세요" value={form.content} error={errors.content}
                  rows={12} onChange={e => setForm({ ...form, content: e.target.value })} />
                <Alert>{serverError}</Alert>
                <div className="flex justify-end gap-2">
                  <Button variant="secondary" onClick={() => navigate(isEdit ? `/posts/${id}` : '/')} disabled={saving}>취소</Button>
                  <Button type="submit" disabled={saving}>{saving ? '저장 중...' : isEdit ? '수정 완료' : '등록'}</Button>
                </div>
              </form>
            </Card>
          )}
        </PageContainer>
      );
    }

    function NotFoundPage() {
      return (
        <PageContainer>
          <Card className="text-center py-16">
            <div className="text-4xl mb-3" aria-hidden="true">🔍</div>
            <p className="font-medium mb-4">페이지를 찾을 수 없어요</p>
            <Link to="/"><Button tabIndex={-1}>목록으로</Button></Link>
          </Card>
        </PageContainer>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================
    function App() {
      return (
        <Router>
          <AuthProvider>
            <Header />
            <Routes fallback={<NotFoundPage />}>
              <Route path="/login" element={<GuestOnly><LoginPage /></GuestOnly>} />
              <Route path="/signup" element={<GuestOnly><SignupPage /></GuestOnly>} />
              <Route path="/" element={<RequireAuth><PostListPage /></RequireAuth>} />
              <Route path="/posts/new" element={<RequireAuth><PostFormPage /></RequireAuth>} />
              <Route path="/posts/:id" element={<RequireAuth><PostDetailPage /></RequireAuth>} />
              <Route path="/posts/:id/edit" element={<RequireAuth><PostFormPage /></RequireAuth>} />
            </Routes>
          </AuthProvider>
        </Router>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
