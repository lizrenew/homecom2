<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 모의투자</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body class="bg-slate-100 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    // ========================================
    // React Hooks Destructuring
    // ========================================
    const { useState, useEffect, useCallback, useRef } = React;

    const API_BASE_URL = '/api';
    const PRICE_POLL_MS = 3000;
    const WALLET_POLL_MS = 5000;
    const CANDLE_POLL_MS = 60000;
    const UP_COLOR = '#f43f5e';   // 상승: 빨강 (국내 관례)
    const DOWN_COLOR = '#3b82f6'; // 하락: 파랑

    const MARKETS = [
      { market: 'KRW-BTC', name: '비트코인', symbol: 'BTC' },
      { market: 'KRW-ETH', name: '이더리움', symbol: 'ETH' },
      { market: 'KRW-XRP', name: '리플', symbol: 'XRP' },
      { market: 'KRW-SOL', name: '솔라나', symbol: 'SOL' },
      { market: 'KRW-DOGE', name: '도지코인', symbol: 'DOGE' },
    ];
    const marketInfo = (m) => MARKETS.find((x) => x.market === m) || { market: m, name: m.split('-')[1], symbol: m.split('-')[1] };

    async function api(endpoint, options = {}) {
      const res = await fetch(`${API_BASE_URL}${endpoint}`, {
        headers: { 'Content-Type': 'application/json' },
        ...options,
      });
      const json = await res.json().catch(() => null);
      // JSON 이 아니면 모의투자 서버가 아닌 곳(Live Server, 파일 직접 열기, 다른 앱)에 붙은 것
      if (!json) throw new Error('모의투자 서버에 연결되지 않았어요. 앱 폴더에서 npm start 후 그 주소로 접속해주세요');
      if (!res.ok || !json.success) throw new Error(json.message || '요청에 실패했어요');
      return json.data;
    }

    // ========================================
    // Formatters
    // ========================================
    const won = (n) => `${Math.round(n).toLocaleString('ko-KR')}원`;
    const signedWon = (n) => { const r = Math.round(n); return `${r > 0 ? '+' : ''}${r.toLocaleString('ko-KR')}원`; };
    const priceFmt = (n) => n.toLocaleString('ko-KR', { maximumFractionDigits: n >= 100 ? 0 : 4 });
    const qtyFmt = (n) => n.toLocaleString('ko-KR', { maximumFractionDigits: 8 });
    const pct = (r) => { const v = Math.round(r * 10000) / 100; return `${v > 0 ? '+' : ''}${v.toFixed(2)}%`; };
    const tone = (v) => { const r = Math.round(v * 10000); return r > 0 ? 'text-rose-500' : r < 0 ? 'text-blue-500' : 'text-slate-500'; };

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Button({ variant = 'primary', size = 'md', disabled, onClick, type = 'button', className = '', children }) {
      const variants = {
        primary: 'bg-indigo-600 text-white hover:bg-indigo-700',
        buy: 'bg-rose-500 text-white hover:bg-rose-600',
        sell: 'bg-blue-500 text-white hover:bg-blue-600',
        secondary: 'bg-slate-100 text-slate-600 hover:bg-slate-200',
        ghost: 'text-slate-400 hover:text-rose-500',
      };
      const sizes = { sm: 'px-2 py-1.5 text-xs', md: 'px-4 py-2 text-sm', lg: 'px-4 py-3 text-base' };
      return (
        <button
          type={type}
          disabled={disabled}
          onClick={onClick}
          className={`rounded-xl font-semibold transition disabled:opacity-50 disabled:cursor-not-allowed ${variants[variant]} ${sizes[size]} ${className}`}
        >
          {children}
        </button>
      );
    }

    function Input({ label, suffix, className = '', ...props }) {
      return (
        <label className={`block ${className}`}>
          {label && <span className="block text-xs text-slate-500 mb-1">{label}</span>}
          <span className="relative block">
            <input
              {...props}
              className={`w-full border border-slate-200 rounded-xl px-4 py-3 ${suffix ? 'pr-14' : ''} tabular-nums focus:outline-none focus:ring-2 focus:ring-indigo-400 disabled:bg-slate-50`}
            />
            {suffix && <span className="absolute right-4 top-3 text-slate-400 text-sm pointer-events-none">{suffix}</span>}
          </span>
        </label>
      );
    }

    function Card({ title, right, padded = true, className = '', children }) {
      return (
        <section className={`bg-white rounded-2xl shadow-sm ${className}`}>
          {title && (
            <div className={`flex items-baseline justify-between ${padded ? 'px-5 pt-5' : 'px-5 pt-4 pb-2'}`}>
              <h2 className="font-bold text-slate-800">{title}</h2>
              {right}
            </div>
          )}
          <div className={padded ? 'p-5 pt-3' : ''}>{children}</div>
        </section>
      );
    }

    function Badge({ variant, children }) {
      const variants = { buy: 'bg-rose-50 text-rose-600', sell: 'bg-blue-50 text-blue-600' };
      return <span className={`inline-block px-2 py-0.5 rounded-md text-xs font-semibold ${variants[variant]}`}>{children}</span>;
    }

    function Empty({ children }) {
      return <div className="text-sm text-slate-400 py-6 text-center">{children}</div>;
    }

    // ========================================
    // 🪝 Data Hooks
    // ========================================
    function usePrices() {
      const [prices, setPrices] = useState({});
      const [error, setError] = useState('');
      useEffect(() => {
        let alive = true;
        // 전 종목을 /api/prices 한 번으로 조회 (업비트 ticker?markets=A,B,…)
        async function tick() {
          try {
            const list = await api(`/prices?markets=${MARKETS.map((m) => m.market).join(',')}`);
            if (!alive) return;
            setPrices(Object.fromEntries(list.map((p) => [p.market, p])));
            setError('');
          } catch (err) {
            if (alive) setError(`시세 조회 실패: ${err.message}`);
          }
        }
        tick();
        const id = setInterval(tick, PRICE_POLL_MS);
        return () => { alive = false; clearInterval(id); };
      }, []);
      return { prices, error };
    }

    function useAccount() {
      const [wallet, setWallet] = useState(null);
      const [orders, setOrders] = useState([]);
      const [error, setError] = useState('');

      const refresh = useCallback(async () => {
        try {
          const [w, o] = await Promise.all([api('/wallet'), api('/orders?limit=50')]);
          setWallet(w);
          setOrders(o);
          setError('');
        } catch (err) { setError(err.message); }
      }, []);

      useEffect(() => {
        refresh();
        const id = setInterval(refresh, WALLET_POLL_MS);
        return () => clearInterval(id);
      }, [refresh]);

      return { wallet, orders, error, refresh };
    }

    // ========================================
    // 🧩 Layout Components
    // ========================================
    function Header({ errors }) {
      return (
        <header className="mb-6">
          <h1 className="text-2xl font-extrabold text-slate-900">📈 나만의 모의투자</h1>
          <p className="text-sm text-slate-500">가상 100만원으로 업비트 실시간 시세에 투자해보세요</p>
          {errors.filter(Boolean).map((e) => <p key={e} role="alert" className="text-xs text-rose-500 mt-1">{e}</p>)}
        </header>
      );
    }

    // ========================================
    // 📄 Page Sections
    // ========================================
    function WalletSummary({ wallet, onReset }) {
      if (!wallet) return <Card><Empty>지갑 불러오는 중…</Empty></Card>;
      return (
        <Card title="내 지갑" right={<Button variant="ghost" size="sm" onClick={onReset}>초기화</Button>}>
          <div className="text-sm text-slate-500">총 자산</div>
          <div className="text-3xl font-extrabold text-slate-900 tabular-nums">{won(wallet.total)}</div>
          <div className={`text-sm font-semibold tabular-nums ${tone(wallet.returnRate)}`}>
            {signedWon(wallet.profit)} · 수익률 {pct(wallet.returnRate)}
          </div>
          <dl className="grid grid-cols-2 gap-4 mt-4">
            <div>
              <dt className="text-xs text-slate-500">현금</dt>
              <dd className="text-lg font-bold text-slate-900 tabular-nums">{won(wallet.cash)}</dd>
            </div>
            <div>
              <dt className="text-xs text-slate-500">코인 평가금액</dt>
              <dd className="text-lg font-bold text-slate-900 tabular-nums">{won(wallet.coinValue)}</dd>
            </div>
          </dl>
          <p className="text-xs text-slate-400 mt-3">시작 자금 {won(wallet.initialCash)} 대비</p>
        </Card>
      );
    }

    function MarketList({ prices, selected, onSelect }) {
      return (
        <Card title="현재가" right={<span className="text-xs text-slate-400">업비트 · {PRICE_POLL_MS / 1000}초마다 갱신</span>} padded={false} className="overflow-hidden">
          <ul>
            {MARKETS.map(({ market, name, symbol }) => {
              const p = prices[market];
              return (
                <li key={market}>
                  <button
                    onClick={() => onSelect(market)}
                    aria-pressed={selected === market}
                    className={`w-full flex items-center justify-between px-5 py-3 text-left hover:bg-slate-50 ${selected === market ? 'bg-indigo-50' : ''}`}
                  >
                    <div>
                      <div className="font-semibold text-slate-800">{name}</div>
                      <div className="text-xs text-slate-400">{symbol}/KRW</div>
                    </div>
                    {p ? (
                      <div className="text-right">
                        <div className={`font-bold tabular-nums ${tone(p.changeRate)}`}>{priceFmt(p.price)}</div>
                        <div className={`text-xs tabular-nums ${tone(p.changeRate)}`}>{pct(p.changeRate)}</div>
                      </div>
                    ) : <div className="text-xs text-slate-300">불러오는 중…</div>}
                  </button>
                </li>
              );
            })}
          </ul>
        </Card>
      );
    }

    // KST 문자열("2026-10-14T01:00:00")을 UTC 로 취급 → 차트 축이 한국 시간으로 표시됨
    const kstToChartTime = (s) => Date.parse(`${s}Z`) / 1000;

    function PriceChart({ market, price, avgPrice }) {
      const containerRef = useRef(null);
      const chartRef = useRef(null);
      const seriesRef = useRef(null);
      const lastBarRef = useRef(null);
      const avgLineRef = useRef(null);
      const [status, setStatus] = useState('loading'); // loading | ready | error
      const info = marketInfo(market);

      // 차트 생성 (최초 1회) + 반응형 리사이즈
      useEffect(() => {
        const el = containerRef.current;
        const chart = LightweightCharts.createChart(el, {
          height: 320,
          layout: { background: { color: 'transparent' }, textColor: '#64748b', fontSize: 11 },
          grid: { vertLines: { color: '#f1f5f9' }, horzLines: { color: '#f1f5f9' } },
          rightPriceScale: { borderVisible: false },
          timeScale: { borderVisible: false, timeVisible: true, secondsVisible: false },
          crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
          localization: { priceFormatter: (p) => priceFmt(p) },
        });
        seriesRef.current = chart.addCandlestickSeries({
          upColor: UP_COLOR, downColor: DOWN_COLOR, borderVisible: false,
          wickUpColor: UP_COLOR, wickDownColor: DOWN_COLOR,
        });
        chartRef.current = chart;
        const ro = new ResizeObserver(([entry]) => chart.applyOptions({ width: entry.contentRect.width }));
        ro.observe(el);
        return () => { ro.disconnect(); chart.remove(); };
      }, []);

      // 마켓이 바뀌면 캔들 200개 로드, 1분마다 다시 로드
      useEffect(() => {
        let alive = true;
        lastBarRef.current = null;
        setStatus('loading');
        async function load(first) {
          try {
            const candles = await api(`/candles?market=${market}&count=200`);
            if (!alive) return;
            const bars = candles.map((c) => ({ time: kstToChartTime(c.time), open: c.open, high: c.high, low: c.low, close: c.close }));
            seriesRef.current.setData(bars);
            lastBarRef.current = bars[bars.length - 1] || null;
            if (first) chartRef.current.timeScale().fitContent();
            setStatus('ready');
          } catch (_) {
            if (alive && first) setStatus('error');
          }
        }
        load(true);
        const id = setInterval(() => load(false), CANDLE_POLL_MS);
        return () => { alive = false; clearInterval(id); };
      }, [market]);

      // 실시간 현재가로 마지막 캔들 갱신
      useEffect(() => {
        const bar = lastBarRef.current;
        if (!bar || !price) return;
        const next = { ...bar, close: price, high: Math.max(bar.high, price), low: Math.min(bar.low, price) };
        lastBarRef.current = next;
        seriesRef.current.update(next);
      }, [price]);

      // 보유 중이면 평단가 라인 표시
      useEffect(() => {
        const series = seriesRef.current;
        if (avgLineRef.current) { series.removePriceLine(avgLineRef.current); avgLineRef.current = null; }
        if (avgPrice) {
          avgLineRef.current = series.createPriceLine({
            price: avgPrice, color: '#6366f1', lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: '내 평단',
          });
        }
      }, [avgPrice, market]);

      return (
        <Card title={`${info.name} 차트`} right={<span className="text-xs text-slate-400">1시간 봉 · 최근 200개</span>}>
          <div className="relative">
            <div ref={containerRef} className="w-full" aria-label={`${info.name} 1시간 캔들 차트`} role="img" />
            {status !== 'ready' && (
              <div className="absolute inset-0 flex items-center justify-center text-sm text-slate-400 bg-white/70">
                {status === 'loading' ? '차트 불러오는 중…' : '차트를 불러오지 못했어요'}
              </div>
            )}
          </div>
        </Card>
      );
    }

    function OrderPanel({ market, price, wallet, onOrdered }) {
      const [side, setSide] = useState('buy');
      const [value, setValue] = useState('');
      const [memo, setMemo] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const [msg, setMsg] = useState(null);
      const info = marketInfo(market);
      const holding = wallet?.holdings.find((h) => h.market === market);
      const cash = wallet?.cash ?? 0;

      useEffect(() => { setValue(''); setMsg(null); }, [market, side]);

      const num = Number(String(value).replace(/,/g, '')) || 0;
      // 매수: 원화 금액 입력 / 매도: 코인 수량 입력
      const preview = !price || !num ? '' : side === 'buy' ? `≈ ${qtyFmt(num / price)} ${info.symbol}` : `≈ ${won(num * price)}`;

      function setRatio(r) {
        if (side === 'buy') setValue(String(Math.floor(cash * r)));
        else if (holding) setValue(String(Math.floor(holding.qty * r * 1e8) / 1e8));
      }

      async function submit(e) {
        e.preventDefault();
        if (num <= 0) return setMsg({ ok: false, text: side === 'buy' ? '매수 금액을 입력해주세요' : '매도 수량을 입력해주세요' });
        setSubmitting(true);
        setMsg(null);
        try {
          const body = { market, side, memo, ...(side === 'buy' ? { amount: num } : { qty: num }) };
          const order = await api('/order', { method: 'POST', body: JSON.stringify(body) });
          setMsg({ ok: true, text: `${side === 'buy' ? '매수' : '매도'} 체결: ${qtyFmt(order.qty)} ${info.symbol} @ ${priceFmt(order.price)}원 (${won(order.amount)})` });
          setValue('');
          setMemo('');
          onOrdered();
        } catch (err) {
          setMsg({ ok: false, text: err.message });
        } finally {
          setSubmitting(false);
        }
      }

      return (
        <Card title={`${info.name} 주문`} right={<span className="text-sm text-slate-500 tabular-nums">현재가 {price ? `${priceFmt(price)}원` : '-'}</span>}>
          <div role="tablist" className="grid grid-cols-2 gap-1 bg-slate-100 rounded-xl p-1 mb-4">
            {[['buy', '매수', 'bg-rose-500'], ['sell', '매도', 'bg-blue-500']].map(([k, label, bg]) => (
              <button key={k} role="tab" aria-selected={side === k} onClick={() => setSide(k)} className={`py-2 rounded-lg text-sm font-semibold ${side === k ? `${bg} text-white` : 'text-slate-500'}`}>
                {label}
              </button>
            ))}
          </div>
          <form onSubmit={submit} className="space-y-3">
            <Input
              label={side === 'buy' ? `주문 가능 ${won(cash)}` : `보유 ${qtyFmt(holding?.qty || 0)} ${info.symbol}`}
              inputMode="decimal"
              value={value}
              onChange={(e) => setValue(e.target.value)}
              placeholder={side === 'buy' ? '매수 금액 (최소 5,000원)' : `매도 수량`}
              suffix={side === 'buy' ? '원' : info.symbol}
            />
            <div className="grid grid-cols-4 gap-1">
              {[0.1, 0.25, 0.5, 1].map((r) => (
                <Button key={r} variant="secondary" size="sm" onClick={() => setRatio(r)}>{r === 1 ? '최대' : `${r * 100}%`}</Button>
              ))}
            </div>
            {preview && <div className="text-xs text-slate-500 text-right tabular-nums">{preview}</div>}
            <Input value={memo} onChange={(e) => setMemo(e.target.value)} placeholder="메모 (선택) — 왜 샀는지/팔았는지" maxLength={200} />
            <Button type="submit" variant={side} size="lg" disabled={submitting || !price} className="w-full font-bold">
              {submitting ? '체결 중…' : side === 'buy' ? '매수하기' : '매도하기'}
            </Button>
          </form>
          {msg && <p role="status" className={`mt-3 text-sm ${msg.ok ? 'text-emerald-600' : 'text-rose-500'}`}>{msg.text}</p>}
        </Card>
      );
    }

    function Holdings({ wallet, onSelect }) {
      const rows = wallet?.holdings || [];
      return (
        <Card title="보유 코인">
          {!rows.length ? <Empty>아직 보유한 코인이 없어요</Empty> : (
            <ul className="divide-y divide-slate-100">
              {rows.map((h) => (
                <li key={h.market}>
                  <button onClick={() => onSelect(h.market)} className="w-full py-3 flex justify-between text-left">
                    <div>
                      <div className="font-semibold text-slate-800">{marketInfo(h.market).name}</div>
                      <div className="text-xs text-slate-400 tabular-nums">{qtyFmt(h.qty)} {h.currency} · 평단 {priceFmt(h.avgPrice)}</div>
                    </div>
                    <div className="text-right">
                      <div className="font-semibold text-slate-800 tabular-nums">{won(h.value)}</div>
                      <div className={`text-xs tabular-nums ${tone(h.profitRate)}`}>{signedWon(h.profit)} ({pct(h.profitRate)})</div>
                    </div>
                  </button>
                </li>
              ))}
            </ul>
          )}
        </Card>
      );
    }

    function OrderHistory({ orders }) {
      return (
        <Card title="주문 내역" right={<span className="text-xs text-slate-400">최근 50건</span>}>
          {!orders.length ? <Empty>주문 내역이 없어요</Empty> : (
            <ul className="divide-y divide-slate-100 max-h-96 overflow-y-auto">
              {orders.map((o) => (
                <li key={o.id} className="py-2.5 text-sm">
                  <div className="flex justify-between gap-2">
                    <div className="min-w-0">
                      <Badge variant={o.side}>{o.side === 'buy' ? '매수' : '매도'}</Badge>{' '}
                      <span className="text-slate-700 font-medium">{marketInfo(o.market).name}</span>
                      <div className="text-xs text-slate-400">{new Date(o.created_at).toLocaleString('ko-KR')}</div>
                    </div>
                    <div className="text-right tabular-nums shrink-0">
                      <div className="text-slate-700">{won(o.amount)}</div>
                      <div className="text-xs text-slate-400">{qtyFmt(o.qty)} @ {priceFmt(o.price)}</div>
                    </div>
                  </div>
                  {o.memo && <p className="text-xs text-slate-500 mt-1 bg-slate-50 rounded-lg px-2 py-1">📝 {o.memo}</p>}
                </li>
              ))}
            </ul>
          )}
        </Card>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================
    function App() {
      const [selected, setSelected] = useState(MARKETS[0].market);
      const { prices, error: priceError } = usePrices();
      const { wallet, orders, error: walletError, refresh } = useAccount();

      async function reset() {
        if (!confirm('지갑을 1,000,000원으로 초기화할까요? 보유 코인과 주문 내역이 모두 삭제돼요.')) return;
        try { await api('/wallet/reset', { method: 'POST' }); } catch (err) { alert(err.message); }
        refresh();
      }

      return (
        <div className="max-w-5xl mx-auto px-4 py-8">
          <Header errors={[priceError, walletError]} />
          <div className="grid gap-4 md:grid-cols-2">
            <div className="md:col-span-2">
              <PriceChart
                market={selected}
                price={prices[selected]?.price}
                avgPrice={wallet?.holdings.find((h) => h.market === selected)?.avgPrice}
              />
            </div>
            <div className="space-y-4">
              <WalletSummary wallet={wallet} onReset={reset} />
              <MarketList prices={prices} selected={selected} onSelect={setSelected} />
            </div>
            <div className="space-y-4">
              <OrderPanel market={selected} price={prices[selected]?.price} wallet={wallet} onOrdered={refresh} />
              <Holdings wallet={wallet} onSelect={setSelected} />
              <OrderHistory orders={orders} />
            </div>
          </div>
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
