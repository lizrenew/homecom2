    // ========================================
    // 🛠️ Utils
    // ========================================
    function matchesCategory(recipe, catId) {
      if (catId === 'all') return true;
      if (recipe.category === catId) return true;
      return recipe.tags.includes(catId);
    }

    function searchRecipes(query) {
      const q = query.trim().toLowerCase();
      if (!q) return [];
      return RECIPES.filter((r) => {
        const haystack = [r.title, r.summary, r.category, ...r.groups.flatMap((g) => g.items)].join(' ').toLowerCase();
        return haystack.includes(q);
      });
    }

    // ========================================
    // 🔀 Router Components
    // ========================================
    const RouterContext = createContext(null);

    function getPath() {
      const hash = window.location.hash.replace(/^#/, '');
      return hash || '/';
    }

    function Router({ children }) {
      const [path, setPath] = useState(getPath);
      useEffect(() => {
        const onChange = () => { setPath(getPath()); window.scrollTo(0, 0); };
        window.addEventListener('hashchange', onChange);
        return () => window.removeEventListener('hashchange', onChange);
      }, []);
      const navigate = useCallback((to) => { window.location.hash = to; }, []);
      return <RouterContext.Provider value={{ path, navigate, params: {} }}>{children}</RouterContext.Provider>;
    }

    function useRouter() {
      return useContext(RouterContext);
    }

    function useParams() {
      return useContext(RouterContext).params;
    }

    function matchRoute(pattern, path) {
      if (pattern === '/*') return {}; // 나머지 전부 (404)
      const p = pattern.split('/').filter(Boolean);
      const s = path.split('/').filter(Boolean);
      if (p.length !== s.length) return null;
      const params = {};
      for (let i = 0; i < p.length; i++) {
        if (p[i].startsWith(':')) params[p[i].slice(1)] = decodeURIComponent(s[i]);
        else if (p[i] !== s[i]) return null;
      }
      return params;
    }

    function Route() {
      return null; // Routes 가 props 만 읽는다
    }

    function Routes({ children }) {
      const router = useRouter();
      for (const child of React.Children.toArray(children)) {
        const params = matchRoute(child.props.path, router.path);
        if (params) {
          return <RouterContext.Provider value={{ ...router, params }}>{child.props.element}</RouterContext.Provider>;
        }
      }
      return null;
    }

    function Link({ to, className = '', children, ...rest }) {
      return <a href={`#${to}`} className={className} {...rest}>{children}</a>;
    }

    // ========================================
    // 🧠 Favorites Context

    const FavoritesContext = createContext(null);

    function FavoritesProvider({ children }) {
      const [ids, setIds] = useState(loadFavorites);
      useEffect(() => saveFavorites(ids), [ids]);
      const toggle = useCallback((id) => {
        setIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
      }, []);
      return <FavoritesContext.Provider value={{ ids, toggle }}>{children}</FavoritesContext.Provider>;
    }

                  <RecipeThumb recipe={recipe} className="w-full sm:w-56 h-44 sm:h-40 rounded-lg shrink-0" />
                  <div className="mt-4 sm:mt-0 flex-1 min-w-0">
                    <div className="flex items-center gap-1.5">
                      <Badge color="gray">{recipe.category}</Badge>
                      {recipe.tags.includes('soyfree') && <Badge>대두프리</Badge>}
                    </div>
                    <div className="mt-2 flex items-start gap-2">
                      <h1 className="text-xl sm:text-2xl font-bold flex-1">{recipe.title}</h1>
                      <FavButton id={recipe.id} className="text-2xl" />
                    </div>
                    <p className="mt-1 text-sm text-ink-sub">{recipe.summary}</p>
                    <dl className="mt-4 grid grid-cols-3 border border-ink-line rounded-lg text-center divide-x divide-ink-line">
                      {[['분량', recipe.servings], ['시간', recipe.time], ['난이도', recipe.difficulty]].map(([k, v]) => (
                        <div key={k} className="py-2.5 px-1">
                          <dt className="text-[11px] text-ink-mute">{k}</dt>
                          <dd className="text-[13px] font-bold mt-0.5">{v}</dd>
                        </div>
                      ))}
                    </dl>
                  </div>
                </div>
              </Card>

              <Card>
                <Tabs items={tabs} value={tab} onChange={setTab} className="pt-4" />
                <div className="p-5 animate-fade" key={tab}>
                  {tab === 'ingredients' && recipe.groups.map((g) => (
                    <div key={g.name} className="mb-5 last:mb-0">
                      <h3 className="text-sm font-bold text-brand-dark mb-2">{g.name}</h3>
                      <ul className="grid sm:grid-cols-2 gap-x-6">
                        {g.items.map((it) => (
                          <li key={it} className="py-2 border-b border-dashed border-ink-line text-sm">{it}</li>
                        ))}
                      </ul>
                    </div>
                  ))}

                  {tab === 'steps' && (
                    <>
                      <p className="text-xs text-ink-mute mb-3">단계를 누르면 완료 표시돼요 · <b className="text-brand">{doneCount}</b>/{recipe.steps.length}</p>
                      <ol className="space-y-2">
                        {recipe.steps.map((s, i) => {
                          const on = !!done[i];
                          return (
                            <li key={i}>
                              <button
                                type="button"
                                onClick={() => setDone((d) => ({ ...d, [i]: !d[i] }))}
                                aria-pressed={on}
                                className={`w-full flex gap-3 text-left p-3 rounded-lg border transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-brand ${on ? 'border-brand bg-brand-light' : 'border-ink-line hover:bg-ink-bg'}`}
                              >
                                <span className={`shrink-0 w-7 h-7 rounded-full text-xs font-bold flex items-center justify-center ${on ? 'bg-brand text-white' : 'bg-ink-bg text-ink-sub'}`}>{on ? '✓' : i + 1}</span>
                                <span className="min-w-0">
                                  <span className={`block text-sm font-bold ${on ? 'text-ink-mute line-through' : ''}`}>{s.title}</span>
                                  <span className={`block text-[13px] mt-0.5 leading-relaxed ${on ? 'text-ink-mute' : 'text-ink-sub'}`}>{s.desc}</span>
                                </span>
                              </button>
                            </li>
                          );
                        })}
                      </ol>
                      {doneCount === recipe.steps.length && (
                        <p className="mt-4 text-center text-sm font-bold text-brand-dark animate-fade">🎉 완성! 맛있게 드세요.</p>
                      )}
                    </>
                  )}

                  {tab === 'allergy' && (
                    <div className="overflow-x-auto">
                      <table className="w-full text-[13px] min-w-[480px]">
                        <thead>
                          <tr className="bg-ink-bg text-ink-sub">
                            <th scope="col" className="text-left font-bold p-2.5">재료</th>
                            <th scope="col" className="text-left font-bold p-2.5">주의 이유</th>
                            <th scope="col" className="text-left font-bold p-2.5">대체 방법</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-ink-line">
                          {recipe.allergy.map((a) => (
                            <tr key={a.item}>
                              <td className="p-2.5 font-bold whitespace-nowrap">{a.item}</td>
                              <td className="p-2.5 text-red-600">{a.reason}</td>
                              <td className="p-2.5 text-ink-sub">{a.fix}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}

                  {tab === 'tips' && (
                    <ul className="space-y-2">
                      {recipe.tips.map((t) => (
                        <li key={t} className="flex gap-2 text-sm bg-ink-bg rounded-lg p-3">
                          <span aria-hidden="true">💡</span><span>{t}</span>
                        </li>
                      ))}
                    </ul>
                  )}
                </div>
              </Card>
            </div>

            <aside className="space-y-5">
              <Card title="함께 보면 좋은 레시피">
                <ul className="divide-y divide-ink-line border-t border-ink-line">
                  {related.map((r) => (
                    <li key={r.id}>
                      <Link to={`/recipe/${r.id}`} className="flex items-center gap-3 px-5 py-3 hover:bg-[#fafbfc]">
                        <RecipeThumb recipe={r} className="w-14 h-14 rounded-lg shrink-0" />
                        <span className="min-w-0">
                          <span className="block text-sm font-bold truncate">{r.title}</span>
                          <span className="block text-xs text-ink-mute">{r.time}</span>
                        </span>
                      </Link>
                    </li>
                  ))}
                </ul>
              </Card>
              <Link to="/" className="block text-center text-sm text-ink-mute hover:underline">← 홈으로</Link>
            </aside>
          </main>
          <Footer />
        </div>
      );
    }

    function NotFoundPage() {
      return (
        <div className="min-h-screen flex flex-col">
          <SubHeader />
          <main className="flex-1 max-w-[1130px] w-full mx-auto px-4 pt-6">
            <Card><EmptyState icon="🧭" title="페이지를 찾을 수 없어요"><Link to="/" className="text-sm text-brand font-bold hover:underline">홈으로 가기</Link></EmptyState></Card>
          </main>
        </div>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================
    function App() {
      return (
        <Router>
          <FavoritesProvider>
            <Routes>
              <Route path="/" element={<HomePage />} />
              <Route path="/recipe/:id" element={<RecipeDetailPage />} />
              <Route path="/search/:q" element={<SearchPage />} />
              <Route path="/category/:id" element={<CategoryPage />} />
              <Route path="/favorites" element={<FavoritesPage />} />
              <Route path="/*" element={<NotFoundPage />} />
            </Routes>
          </FavoritesProvider>
        </Router>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
