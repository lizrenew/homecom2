    body { font-family: 'Noto Sans KR', system-ui, sans-serif; }

    .animate-marquee { animation: marquee 28s linear infinite; }

      .animate-floaty, .animate-marquee, .animate-glow { animation: none; }

      { id: 'DcJvQypz5VS', name: '빌리지인', note: '#mj', date: '2026-08-17', account: 'pesssix', likes: 7352, likesLabel: '7,352', period: 'summer', tags: ['#댄스챌린지', '#mj'], memo: '여름 시즌 인기작', url: 'https://www.instagram.com/pesssix/reel/DcJvQypz5VS/' },
      { id: 'DbU4RhsJya2', name: 'GUAP', note: '브랜드 광고', date: '2026-07-27', account: 'gorillaenergy.kr', likes: 2904, likesLabel: '2,904', period: 'summer', tags: ['#GUAP', '#고릴라에너지'], memo: '에너지드링크 브랜드 챌린지', url: 'https://www.instagram.com/gorillaenergy.kr/reel/DbU4RhsJya2/' },

      { id: 'DU2uEyfAZrx', name: '미워', note: '', date: '2026-02-17', account: 'fronting_official', likes: 38000, likesLabel: '38K', period: 'early', tags: ['#미워', '#겨울릴스'], memo: '올해 좋아요 최다 (38K)', url: 'https://www.instagram.com/fronting_official/reel/DU2uEyfAZrx/', top: true },

    ];

    const EXCLUDED = [
      '곡명을 알 수 없는 게시물 4개 — 스파오키즈 광고(@ge__c, 8/20, 35K), 키키코 코디 릴스 2개(4/8, 7/20), "유행이라 하기에.."(6/1)',
      '오래된 게시물 13개 — 2022~2025년 게시물',
    ];

    const thumb = (id) => `../images/thumbs/${id}.jpg`;
    const fmtDate = (d) => { const [, m, day] = d.split('-'); return `${Number(m)}/${Number(day)}`; };

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Button({ variant = 'primary', size = 'md', disabled = false, onClick, className = '', children, ...rest }) {
      const variants = {
        primary: 'bg-gradient-to-r from-fuchsia-500 to-orange-400 text-white hover:brightness-110 shadow-lg shadow-fuchsia-500/20',
        secondary: 'bg-white/10 text-zinc-100 hover:bg-white/20 border border-white/10',
        danger: 'bg-red-500 text-white hover:bg-red-600',
        ghost: 'text-zinc-300 hover:text-white hover:bg-white/5',
      };
      const sizes = { sm: 'px-3 py-1.5 text-sm', md: 'px-4 py-2 text-sm', lg: 'px-6 py-3 text-base' };
      return (
        <button
          type="button"
          disabled={disabled}
          onClick={onClick}
          className={`inline-flex items-center justify-center gap-2 rounded-full font-bold transition focus:outline-none focus-visible:ring-2 focus-visible:ring-fuchsia-400 disabled:opacity-40 disabled:cursor-not-allowed ${variants[variant]} ${sizes[size]} ${className}`}
          {...rest}
        >
          {children}
        </button>
      );
    }

    function Input({ type = 'text', label, value, onChange, placeholder, error, disabled = false, className = '', id }) {
      const inputId = id || `input-${label || 'field'}`;
      return (
        <div className={className}>
          {label && <label htmlFor={inputId} className="sr-only">{label}</label>}
          <input
            id={inputId}
            type={type}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            disabled={disabled}
            aria-invalid={!!error}
            className="w-full rounded-full bg-white/5 border border-white/10 px-5 py-2.5 text-sm placeholder:text-zinc-500 focus:outline-none focus:ring-2 focus:ring-fuchsia-400 focus:border-transparent"
          />
          {error && <p className="mt-1 text-xs text-red-400">{error}</p>}
        </div>
      );
    }

    function Card({ className = '', children, ...rest }) {
      return (
        <div className={`rounded-3xl bg-white/[0.04] border border-white/10 backdrop-blur ${className}`} {...rest}>
          {children}
        </div>
      );
    }

    function Badge({ tone = 'default', className = '', children }) {
      const tones = {
        default: 'bg-white/10 text-zinc-200',
        hot: 'bg-gradient-to-r from-fuchsia-500 to-orange-400 text-white',
        muted: 'bg-zinc-800 text-zinc-400',
      };
      return <span className={`inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-bold ${tones[tone]} ${className}`}>{children}</span>;
    }

    function Modal({ isOpen, onClose, title, size = 'md', children }) {
      useEffect(() => {
        if (!isOpen) return;
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', onKey);
        document.body.style.overflow = 'hidden';
        return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
      }, [isOpen, onClose]);
      if (!isOpen) return null;
      const sizes = { sm: 'max-w-md', md: 'max-w-2xl', lg: 'max-w-4xl' };
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-label={title}>
          <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose} />
          <div className={`relative w-full ${sizes[size]} max-h-[90vh] overflow-auto rounded-3xl bg-zinc-900 border border-white/10 shadow-2xl`}>
            <button onClick={onClose} aria-label="닫기" className="absolute right-4 top-4 z-10 grid h-9 w-9 place-items-center rounded-full bg-black/50 text-zinc-200 hover:bg-black/80">✕</button>
            {children}
          </div>
        </div>
      );
    }

    function Tabs({ tabs, value, onChange, className = '' }) {
      return (
        <div role="tablist" className={`flex flex-wrap gap-2 ${className}`}>
          {tabs.map((t) => (
            <button
              key={t.value}
              role="tab"
              aria-selected={value === t.value}
              onClick={() => onChange(t.value)}
              className={`rounded-full px-4 py-2 text-sm font-bold transition ${value === t.value ? 'bg-white text-zinc-900' : 'bg-white/5 text-zinc-300 hover:bg-white/10'}`}
            >
              {t.label}
              {t.count != null && <span className={`ml-1.5 text-xs ${value === t.value ? 'text-zinc-500' : 'text-zinc-500'}`}>{t.count}</span>}
            </button>
          ))}
        </div>
      );
    }

    // ========================================
    // 🧩 Common/Layout Components
    // ========================================
    function Header() {
      return (
        <header className="sticky top-0 z-40 border-b border-white/5 bg-zinc-950/70 backdrop-blur">

    function Marquee() {
      const names = [...new Set(CHALLENGES.map((c) => c.name))];
      const row = [...names, ...names];
      return (
        <div className="relative overflow-hidden border-y border-white/10 bg-gradient-to-r from-fuchsia-600/20 via-orange-500/10 to-fuchsia-600/20 py-3" aria-hidden="true">

    // ========================================
    // 🧱 Feature Components
    // ========================================
    function ChallengeCard({ item, rank, onOpen }) {

            {rank && <div className="absolute right-3 top-2 font-display text-4xl text-white/90 drop-shadow">#{rank}</div>}
            <div className="absolute inset-x-0 bottom-0 p-4">

                <span className="font-bold text-white">♥ {item.likesLabel}</span>
              </div>
            </div>
          </div>
        </button>
      );

                />
              ))}
            </div>

      );

            <StatCard value={hotCount} label="요즘 뜨는 챌린지" sub="9~10월 게시" />
            <StatCard value="38K" label="최다 좋아요" sub="미워 챌린지 (2월)" />

        </section>
      );
    }

    function Ranking({ onOpen }) {
      const top = useMemo(() => [...CHALLENGES].filter((c) => c.likes != null).sort((a, b) => b.likes - a.likes).slice(0, 4), []);
      return (
        <section id="ranking" className="mx-auto max-w-6xl scroll-mt-20 px-4 py-12">
          <div className="mb-8 flex items-end justify-between gap-4">
            <div>
              <p className="text-sm font-bold text-fuchsia-400">LIKES RANKING</p>
              <h2 className="mt-1 font-display text-3xl sm:text-4xl">좋아요 TOP 4</h2>
            </div>
            <p className="hidden text-sm text-zinc-500 sm:block">카드를 누르면 상세 정보가 열려요</p>
          </div>
          <div className="grid grid-cols-2 gap-4 lg:grid-cols-4">
            {top.map((item, i) => <ChallengeCard key={item.id} item={item} rank={i + 1} onOpen={onOpen} />)}
          </div>
        </section>
      );
    }

    function ChallengeList({ onOpen }) {
      const [period, setPeriod] = useState('all');
      const [query, setQuery] = useState('');
      const [sort, setSort] = useState('date');

      const counts = useMemo(() => CHALLENGES.reduce((acc, c) => ({ ...acc, [c.period]: (acc[c.period] || 0) + 1 }), {}), []);
      const tabs = [
        { value: 'all', label: '전체', count: CHALLENGES.length },
        ...Object.entries(PERIODS).map(([k, v]) => ({ value: k, label: v.label, count: counts[k] || 0 })),
      ];

      const items = useMemo(() => {
        const q = query.trim().toLowerCase();
        return CHALLENGES
          .filter((c) => period === 'all' || c.period === period)
          .filter((c) => !q || [c.name, c.note, c.account, ...c.tags].join(' ').toLowerCase().includes(q))
          .sort((a, b) => sort === 'likes' ? (b.likes ?? -1) - (a.likes ?? -1) : b.date.localeCompare(a.date));
      }, [period, query, sort]);

      return (
        <section id="list" className="mx-auto max-w-6xl scroll-mt-20 px-4 py-12">
          <p className="text-sm font-bold text-fuchsia-400">ALL CHALLENGES</p>
          <h2 className="mt-1 font-display text-3xl sm:text-4xl">전체 챌린지</h2>

          <div className="mt-8 flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
            <Tabs tabs={tabs} value={period} onChange={setPeriod} />
            <div className="flex gap-2">
              <Input label="챌린지 검색" id="search" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="챌린지·계정·해시태그 검색" className="flex-1 lg:w-64" />
              <Button variant="secondary" onClick={() => setSort(sort === 'date' ? 'likes' : 'date')} aria-label="정렬 기준 바꾸기">
                {sort === 'date' ? '최신순' : '좋아요순'} ⇅
              </Button>
            </div>
          </div>

          {items.length === 0 ? (
            <Card className="mt-8 p-12 text-center">
              <p className="text-4xl">🕺</p>
              <p className="mt-3 font-bold">"{query}"에 맞는 챌린지가 없어요</p>
              <Button variant="ghost" size="sm" className="mt-3" onClick={() => { setQuery(''); setPeriod('all'); }}>필터 초기화</Button>
            </Card>
          ) : (
            <div className="mt-8 grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4">
              {items.map((item) => <ChallengeCard key={item.id} item={item} onOpen={onOpen} />)}
            </div>
          )}

          <div className="mt-12 overflow-x-auto rounded-3xl border border-white/10">
            <table className="w-full min-w-[640px] text-left text-sm">
              <caption className="sr-only">챌린지 요약 표</caption>
              <thead className="bg-white/5 text-zinc-400">
                <tr>
                  <th className="px-4 py-3 font-medium">챌린지</th>
                  <th className="px-4 py-3 font-medium">게시일</th>
                  <th className="px-4 py-3 font-medium">계정</th>
                  <th className="px-4 py-3 font-medium text-right">좋아요</th>
                  <th className="px-4 py-3 font-medium">링크</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-white/5">
                {items.map((c) => (
                  <tr key={c.id} className="hover:bg-white/[0.03]">
                    <td className="px-4 py-3">
                      <div className="flex items-center gap-3">
                        <img src={thumb(c.id)} alt="" className="h-12 w-7 rounded object-cover" />
                        <span className="font-bold">{c.name}</span>
                      </div>
                    </td>
                    <td className="px-4 py-3 text-zinc-400">{fmtDate(c.date)}</td>
                    <td className="px-4 py-3 text-zinc-400">@{c.account}</td>
                    <td className="px-4 py-3 text-right font-bold">{c.likesLabel}</td>
                    <td className="px-4 py-3"><a href={c.url} target="_blank" rel="noopener noreferrer" className="text-fuchsia-400 hover:underline">릴스 ↗</a></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </section>
      );
    }

    function Method() {
      return (
        <section id="method" className="mx-auto max-w-6xl scroll-mt-20 px-4 py-12">
          <Card className="grid gap-8 p-6 sm:p-10 md:grid-cols-2">
            <div>
              <p className="text-sm font-bold text-fuchsia-400">METHOD</p>
              <h2 className="mt-1 font-display text-3xl">조사 방법</h2>
              <ol className="mt-5 space-y-3 text-sm text-zinc-300">
                <li><b className="text-white">1.</b> Playwright MCP로 인스타그램 검색 탭에서 <b>댄스챌린지</b> 키워드 검색</li>
                <li><b className="text-white">2.</b> 상위 게시물 30개 수집</li>
                <li><b className="text-white">3.</b> 2026년 게시물 17개의 작성자·날짜·캡션 확인 후 13개 챌린지로 정리</li>
              </ol>
              <p className="mt-5 text-xs text-zinc-500">좋아요 수는 {RESEARCH_DATE} 기준이며, 인스타그램 추천 순서 결과라 전체 인기 순위와는 다를 수 있어요.</p>
            </div>
            <div>
              <h3 className="font-display text-2xl">정리에서 뺀 것</h3>
              <ul className="mt-5 space-y-3 text-sm text-zinc-400">
                {EXCLUDED.map((e) => <li key={e} className="flex gap-2"><span className="text-fuchsia-400">—</span>{e}</li>)}
              </ul>
            </div>
          </Card>
        </section>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================
    function App() {
      const [selected, setSelected] = useState(null);
      const open = useCallback((item) => setSelected(item), []);
      const close = useCallback(() => setSelected(null), []);

      return (
        <div className="relative z-10">
          <Header />
          <main>
            <Hero />
            <Marquee />
            <Stats />
            <Ranking onOpen={open} />
            <ChallengeList onOpen={open} />
            <Method />
          </main>
          <Footer />
          <Modal isOpen={!!selected} onClose={close} title={selected?.name} size="md">
            {selected && <ChallengeDetail item={selected} />}
          </Modal>
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
